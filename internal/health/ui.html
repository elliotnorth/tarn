<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tarn</title>
<style>
:root {
  --bg: #faf9f8; --panel: #fff; --text: #1f1e1d; --muted: #706e6b; --line: #e7e5e2;
  --hover: #f4f3f1; --accent: #3b5bdb; --good: #2b8a3e; --warn: #c2700a; --bad: #c92a2a;
  --badge: #efedea; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181a; --panel: #212124; --text: #ececea; --muted: #a09e9a; --line: #333336;
    --hover: #2a2a2d; --accent: #8ea6ff; --good: #5cc26f; --warn: #e6a14a; --bad: #ff7b7b;
    --badge: #333336; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
.dnsbar { background: var(--bad); color: var(--panel); font-weight: 500; padding: 10px 16px; font-size: 14px; text-align: center; overflow-wrap: anywhere; }
.dnsbar[hidden] { display: none; }
.top { display: flex; align-items: center; gap: 12px; padding-top: 14px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.zone { color: var(--muted); overflow-wrap: anywhere; }
.pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
nav { display: flex; gap: 20px; margin-top: 8px; overflow-x: auto; }
nav a { padding: 10px 0; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
nav a:hover { color: var(--text); }
nav a[aria-current=page] { color: var(--text); border-bottom-color: var(--text); }
main { padding: 24px 0 48px; }
h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.bar { margin-bottom: 14px; }
input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; max-width: 320px; }
input:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--hover); }
.name { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
.badge { font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--badge); color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.nowrap { white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rows { padding: 2px 16px; }
.row { display: flex; gap: 16px; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row span:first-child { color: var(--muted); flex: none; }
.row span:last-child { text-align: right; overflow-wrap: anywhere; }
h2 { font-size: 15px; margin: 22px 0 8px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.alert { border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; overflow-wrap: anywhere; }
.alert.warn { border-color: var(--warn); color: var(--warn); }
code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
form.login { display: flex; flex-wrap: wrap; gap: 8px; }
button.ghost { color: var(--text); background: transparent; border: 1px solid var(--line); }
button.danger { background: var(--bad); }
button:disabled { opacity: .6; cursor: default; }
.tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.actions { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; align-items: center; }
.actions button { padding: 4px 10px; font-size: 13px; }
.edit { padding: 16px; margin-bottom: 14px; }
.edit h2 { margin: 0 0 12px; }
.edit label { display: block; font-weight: 500; margin-bottom: 12px; }
.edit input { display: block; margin-top: 4px; max-width: 480px; font-weight: 400; }
.edit input[readonly] { color: var(--muted); }
.edit label.check { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.edit label.check input { display: inline-block; width: auto; margin: 0; }
.edit label.check .help { flex-basis: 100%; margin-top: 0; }
.help { color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 4px; }
.err { color: var(--bad); margin: 0 0 12px; overflow-wrap: anywhere; }
.signin { padding: 16px; margin-bottom: 14px; }
.signin p { margin: 0 0 10px; }
.banner { border: 1px solid var(--warn); background: var(--panel); border-radius: 8px; padding: 14px 16px; margin-top: 16px; }
.banner b { display: block; margin-bottom: 4px; }
.banner .actions { justify-content: flex-start; margin-top: 10px; flex-wrap: wrap; }
.banner input { max-width: 260px; }
.notes { margin: 8px 0 12px; padding-left: 18px; }
.notes li { margin-bottom: 4px; }
.token { display: block; padding: 10px; background: var(--badge); border-radius: 6px; overflow-wrap: anywhere; margin: 8px 0; user-select: all; }
.setting { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.setting:last-child { border-bottom: 0; }
.setting .val { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; display: block; margin-top: 4px; }
footer { color: var(--muted); font-size: 12px; padding-bottom: 24px; }
@media (max-width: 640px) { .hide-sm { display: none; } td, th { padding-left: 12px; padding-right: 12px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <span class="brand">tarn</span><span class="zone" id="zone"></span>
    <span class="pill" id="pill" role="status"><span class="dot"></span>Loading</span>
  </div>
  <nav aria-label="Sections">
    <a href="#machines">Machines</a><a href="#services">Services</a><a href="#dns">DNS</a><a href="#certificate">Certificate</a><a href="#settings">Settings</a><a href="#history">History</a>
  </nav>
</div></header>
<div id="dnsbar" class="dnsbar" role="alert" hidden></div>
<div class="wrap"><div id="banner"></div><main id="main"></main><footer id="foot"></footer></div>
<script>
"use strict";
// Everything from the server goes in through textContent, never innerHTML:
// device names come from the tailnet.
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k);
  return e;
}
const state = { session: null, health: null, records: null, services: null, error: "", locked: false, filter: "", settings: null, history: null, edit: null, preview: null, shownToken: "", message: "", keepError: "", form: null, confirm: "", notice: "", authError: "" };
let token = "";
try { token = sessionStorage.getItem("tarn-token") || ""; } catch (e) {}

async function api(path) {
  const r = await fetch(path, { headers: token ? { Authorization: "Bearer " + token } : {}, cache: "no-store" });
  if (r.status === 401) { const e = new Error("locked"); e.locked = true; throw e; }
  return r.json(); // /healthz is still JSON when it answers 503
}
// Changes carry a header that other sites can't send, which is what blocks
// forged requests. The session itself is an HttpOnly cookie.
async function send(method, path, body) {
  const r = await fetch(path, {
    method, credentials: "same-origin",
    headers: { "X-Tarn-Request": "1", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "That didn't work. Try again.");
  return j;
}
async function load(force) {
  try {
    state.session = await api("/session");
    state.error = "";
    try {
      state.health = await api("/healthz");
      [state.records, state.services] = await Promise.all([api("/records"), api("/services")]);
      state.locked = false;
      const sess = state.session;
      if (sess.signed_in && sess.control) {
        [state.settings, state.history] = await Promise.all([send("GET", "/settings"), send("GET", "/history")]);
      } else {
        state.settings = state.history = null;
      }
    } catch (e) {
      if (!e.locked) throw e;
      state.locked = true;
      state.health = state.records = state.services = null;
    }
  } catch (e) {
    state.error = "Can't reach tarn. Showing the last data it sent.";
  }
  render(false, force);
}
const fmt = t => t ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "Never";
function ago(t) {
  if (!t) return "Never";
  const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000));
  return s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : Math.round(s / 3600) + "h ago";
}
const daysLeft = t => Math.floor((new Date(t) - Date.now()) / 86400000);
const page = () => { const p = location.hash.slice(1); return ["machines", "services", "dns", "certificate", "settings", "history"].includes(p) ? p : "machines"; };

function head(title, sub) { return [h("h1", null, title), h("p", { class: "sub" }, sub)]; }
function table(cols, rows, empty) {
  if (!rows.length) return h("div", { class: "card" }, h("div", { class: "empty" }, empty));
  return h("div", { class: "card" }, h("table", null,
    h("thead", null, h("tr", null, cols.map(c => h("th", c[1] ? { class: c[1], scope: "col" } : { scope: "col" }, c[0])))),
    h("tbody", null, rows)));
}
function details(pairs) {
  return h("div", { class: "card rows" }, pairs.map(([k, v]) => h("div", { class: "row" }, h("span", null, k), h("span", null, v))));
}
// Everything needs sign-in when the page is reached through the proxy.
function gate() {
  const sess = state.session || {};
  return sess.editable && !sess.signed_in ? signInForm() : loginForm();
}
function loginForm() {
  const input = h("input", { type: "password", placeholder: "Token", "aria-label": "Token", autocomplete: "off" });
  const form = h("form", { class: "login" }, input, h("button", { type: "submit" }, "Unlock"));
  form.addEventListener("submit", ev => {
    ev.preventDefault();
    token = input.value.trim();
    try { sessionStorage.setItem("tarn-token", token); } catch (e) {}
    load();
  });
  return h("div", { class: "card" }, h("div", { class: "empty" },
    h("p", null, "Enter the records token, or open this page on the machine itself."), form));
}
function machines() {
  const out = head("Machines", "Every device tarn answers for.");
  if (state.locked) return out.concat(loginForm());
  const search = h("input", { type: "search", placeholder: "Search by name or address", "aria-label": "Search machines", value: state.filter, id: "q" });
  search.addEventListener("input", () => { state.filter = search.value; render(true); });
  const clashes = (state.health && state.health.collisions) || [];
  if (clashes.length) out.push(h("div", { class: "alert warn", role: "status" }, h("b", null, "Name clashes"), clashes.map(c => h("div", null, clashText(c)))));
  out.push(h("div", { class: "bar" }, search));
  const zone = (state.health && state.health.zone) || "";
  const q = state.filter.toLowerCase();
  const list = (state.records || []).filter(r => !r.service &&
    (r.name + " " + (r.ipv4 || []).join(" ") + " " + (r.ipv6 || []).join(" ")).toLowerCase().includes(q));
  out.push(h("div", { id: "list" }, table([["Machine"], ["Addresses"], ["Status"]], list.map(r => h("tr", null,
    h("td", null, h("div", { class: "name" }, r.name, r.self ? h("span", { class: "badge" }, "This machine") : null),
      h("div", { class: "small" }, zone ? r.name + "." + zone : "")),
    h("td", null, h("div", { class: "mono" }, (r.ipv4 || []).join(", ")), h("div", { class: "small mono hide-sm" }, (r.ipv6 || []).join(", "))),
    h("td", { class: "nowrap" }, h("span", { class: "dot " + (r.online ? "good" : "") }), r.online ? "Connected" : "Offline")
  )), q ? "No machines match that search." : "No machines yet.")));
  return out;
}
function clashText(c) {
  const dropped = (c.dropped_ip && c.dropped_ip.length ? c.dropped_ip : c.losers).join(", ");
  return c.service
    ? c.name + " is a service, so the device at " + dropped + " can't be reached by that name. Rename the device in Tailscale or the service here."
    : c.name + " goes to " + (c.kept_ip || c.winner) + ". Also named " + c.name + ", and not reachable by it: " + dropped + ". Rename one in Tailscale.";
}
function signInForm() {
  const input = h("input", { type: "password", placeholder: "Password", "aria-label": "Password", autocomplete: "current-password", required: "required" });
  const form = h("form", { class: "login" }, input, h("button", { type: "submit" }, "Sign in"));
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    try {
      await send("POST", "/login", { password: input.value });
      state.authError = "";
      await load(true);
    } catch (e) {
      state.authError = e.message;
      render(false, true);
    }
  });
  return h("div", { class: "card signin" },
    h("p", null, "Sign in to add, change or remove services."),
    state.authError ? h("p", { class: "err", role: "alert" }, state.authError) : null, form);
}
// Settings each app needs before it works under a new name. Matched against the
// service name and address, so "cloud" pointing at a Nextcloud box still matches.
const appHints = [
  [["nextcloud"], host => "Nextcloud: in config.php, add " + host + " to trusted_domains, set overwritehost to " + host + " and overwriteprotocol to https, and add tarn's tailnet IP to trusted_proxies."],
  [["vaultwarden", "bitwarden"], host => "Vaultwarden: set DOMAIN=https://" + host + " and restart it. Passkeys and security keys made under the old name won't work under this one."],
  [["immich"], host => "Immich: in Administration, Settings, Server, set External domain to https://" + host + " so shared links use it."],
  [["jellyfin"], () => "Jellyfin: in Dashboard, Networking, add tarn's tailnet IP to Known proxies so it sees real client addresses."],
  [["homeassistant", "home-assistant", "hass"], () => "Home Assistant: in configuration.yaml under http:, set use_x_forwarded_for: true and add tarn's tailnet IP to trusted_proxies, or it answers 400 Bad Request."],
  [["ente", "minio", "s3"], host => "Ente and other S3 storage: turn on Preserve host for the storage service, and set museum's S3 endpoint to https://" + host + " so signed links match."],
];
function appHint(name, upstream, zone) {
  const text = (name + " " + upstream).toLowerCase(), host = (name || "<name>") + "." + zone;
  const hit = appHints.find(([keys]) => keys.some(k => text.split(/[^a-z0-9-]+/).some(w => w === k || w.startsWith(k + "-") || w.endsWith("-" + k)) || (k.length > 4 && text.includes(k))));
  return hit ? hit[1](host) : "";
}
function serviceForm() {
  const f = state.form, zone = (state.health && state.health.zone) || "";
  const name = h("input", { value: f.name, required: "required", autocomplete: "off", spellcheck: "false", placeholder: "nextcloud" });
  if (f.edit) name.setAttribute("readonly", "readonly");
  const upstream = h("input", { value: f.upstream, required: "required", autocomplete: "off", spellcheck: "false", placeholder: "https://nextcloud.tail1234.ts.net" });
  const preserve = h("input", { type: "checkbox" });
  if (f.preserve) preserve.setAttribute("checked", "checked");
  const save = h("button", { type: "submit" }, f.edit ? "Save" : "Add service");
  const cancel = h("button", { type: "button", class: "ghost" }, "Cancel");
  const hint = h("p", { class: "help", role: "note" });
  const showHint = () => { hint.textContent = appHint(name.value.trim().toLowerCase(), upstream.value.trim(), zone); };
  name.addEventListener("input", showHint);
  upstream.addEventListener("input", showHint);
  showHint();
  cancel.addEventListener("click", () => { state.form = null; render(false, true); });
  const form = h("form", { class: "card edit" },
    h("h2", null, f.edit ? "Change " + f.name : "Add a service"),
    f.error ? h("p", { class: "err", role: "alert" }, f.error) : null,
    h("label", null, "Name", name, h("div", { class: "help" }, f.edit ? "" : "It will be at <name>." + zone + ". A device with the same name loses that name.")),
    h("label", null, "Forwards to", upstream, h("div", { class: "help" }, "The address tarn sends traffic to: a ts.net address or an IP and port.")),
    h("label", { class: "check" }, preserve, "Preserve host", h("div", { class: "help" }, "Forward requests byte for byte. Only for apps that hand out signed links, such as S3, MinIO or Ente.")),
    hint,
    h("div", { class: "actions", style: "justify-content:flex-start" }, save, cancel));
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    f.name = name.value.trim().toLowerCase();
    f.upstream = upstream.value.trim();
    f.preserve = preserve.checked;
    save.disabled = true;
    try {
      await send("PUT", "/services/" + encodeURIComponent(f.name), { upstream: f.upstream, preserve_host: f.preserve });
      state.form = null;
      state.notice = "";
      await load(true);
    } catch (e) {
      f.error = e.message;
      render(false, true);
    }
  });
  return form;
}
function button(label, cls, fn) {
  const b = h("button", { type: "button", class: cls }, label);
  b.addEventListener("click", fn);
  return b;
}
async function removeService(name) {
  try {
    await send("DELETE", "/services/" + encodeURIComponent(name));
    state.notice = "";
  } catch (e) {
    state.notice = e.message;
  }
  state.confirm = "";
  await load(true);
}
function serviceActions(s) {
  if (s.builtin) return h("span", { class: "small" }, "tarn's own page");
  if (state.confirm === s.name) {
    return h("div", { class: "actions" }, h("span", { class: "small" }, "Remove?"),
      button("Remove", "danger", () => removeService(s.name)),
      button("Keep", "ghost", () => { state.confirm = ""; render(false, true); }));
  }
  return h("div", { class: "actions" },
    button("Change", "ghost", () => { state.confirm = ""; state.form = { edit: true, name: s.name, upstream: s.upstream, preserve: !!s.preserve_host, error: "" }; render(false, true); }),
    button("Remove", "ghost", () => { state.form = null; state.confirm = s.name; render(false, true); }));
}
function services() {
  const out = head("Services", "Names tarn serves over HTTPS.");
  const sess = state.session || {}, canEdit = sess.editable && sess.signed_in;
  if (state.notice) out.push(h("div", { class: "alert", role: "alert" }, state.notice));
  if (sess.editable && !sess.signed_in) {
    out.push(signInForm());
    if (state.locked) return out;
  } else if (state.locked) {
    return out.concat(loginForm());
  }
  if (canEdit) {
    out.push(h("div", { class: "tools" },
      button("Add service", "", () => { state.confirm = ""; state.form = { edit: false, name: "", upstream: "", preserve: false, error: "" }; render(false, true); }),
      button("Sign out", "ghost", async () => { await send("POST", "/logout").catch(() => {}); state.form = null; state.confirm = ""; await load(true); })));
    if (state.form) out.push(serviceForm());
  }
  const zone = (state.health && state.health.zone) || "";
  const cols = [["Service"], ["Address"], ["Forwards to", "hide-sm"]];
  if (canEdit) cols.push([""]);
  const empty = canEdit ? "No services yet. Add your first one." : h("span", null, "No services. Add lines to the file set with ", h("code", null, "-services-file"), ".");
  out.push(table(cols, (state.services || []).map(s => h("tr", null,
    h("td", null, h("div", { class: "name" }, s.name, s.preserve_host ? h("span", { class: "badge" }, "Preserve host") : null, s.builtin ? h("span", { class: "badge" }, "Built in") : null)),
    h("td", null, h("a", { href: "https://" + s.name + "." + zone, rel: "noreferrer" }, s.name + "." + zone)),
    h("td", { class: "small mono hide-sm" }, s.upstream),
    canEdit ? h("td", null, serviceActions(s)) : null
  )), empty));
  return out;
}
function dns() {
  const s = state.health || {}, c = s.dns || {};
  const out = head("DNS", "Queries answered since tarn last started.");
  const stat = (label, n) => h("div", { class: "stat" }, h("b", null, (n || 0).toLocaleString()), h("span", { class: "small" }, label));
  out.push(h("div", { class: "stats" }, stat("Answered", (c.answered || 0) + (c.no_data || 0)), stat("Unknown names", c.nxdomain), stat("Refused", c.refused), stat("Failed", (c.servfail || 0) + (c.not_implemented || 0))));
  out.push(details([["Zone", s.zone || ""], ["Names served", String(s.records || 0)], ["Device list read", ago(s.last_refresh)], ["Failed reads in a row", String(s.consecutive_failures || 0)]]));
