name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The latest patch release, not go.mod's minimum: go.mod says 1.27.0,
          # and govulncheck fails on that version's standard-library bugs.
          go-version: stable
          cache: true

      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # A short run on every push; longer runs are done by hand. Seeds and past
      # failures in testdata/fuzz already run as part of go test above.
      - name: fuzz smoke (DNS responder)
        run: go test -run '^$' -fuzz '^FuzzReply$' -fuzztime 30s ./internal/dnsserver

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: go build
        run: go build -o tarn .

      - name: .deb installs, upgrades and purges cleanly
        run: |
          CGO_ENABLED=0 go build -trimpath -o tarn-linux-amd64 .
          deb=$(go run ./tools/mkdeb -bin tarn-linux-amd64 -arch amd64 -version v0.0.0-ci)
          sudo dpkg -i "$deb"
          getent passwd tarn
          /usr/bin/tarn -version
          systemd-analyze verify /usr/lib/systemd/system/tarn.service
          if systemctl is-active --quiet tarn; then echo "started without a zone"; exit 1; fi
          sudo dpkg -i "$deb"
          sudo dpkg --purge tarn
          test ! -e /usr/bin/tarn
          test ! -e /usr/lib/systemd/system/tarn.service
